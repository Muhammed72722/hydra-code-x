experiment: a0_backbone_ablation
seed: 17
models:
  - hydra_300m
  - dense_transformer_300m
fixed:
  training_tokens: 500000000
  context: 8192
  precision: bf16
  micro_batch: 1
  grad_accum: 32
  lr: 0.0003
  weight_decay: 0.1
  warmup_ratio: 0.02
metrics:
  - validation_loss
  - fim_score
  - code_completion
  - human_eval_plus
  - mbpp_plus
  - tokens_per_second
  - peak_memory_mb
  - training_stability
