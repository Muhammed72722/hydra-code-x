model:
  vocab_size: 32768
  d_model: 1280
  n_layers: 12
  max_seq_len: 8192
  ffn_dim: 3584
  attention_layers: [2, 5, 8, 10]
  q_heads: 10
  kv_heads: 2
  attention_window: 2048
  mamba_state: 64
  mamba_headdim: 64
  mamba_expand: 2
  memory_slots: 0
  memory_topk: 0
  tie_embeddings: true

training:
  max_steps: 10000
  grad_accum_steps: 32
  lr: 0.0003
  warmup_steps: 500
  min_lr_ratio: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  bf16: true
  seed: 17
